name: Product API Production CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  ci-test:
    name: CI - Build, Test & Healthcheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Docker Compose with Healthcheck
        run: |
          docker compose up -d --build
          echo "Waiting for services to become healthy..."
          
          # Đợi tối đa 60 giây cho các container khởi chạy hoàn tất
          for i in {1..12}; do
            echo "Checking status (attempt $i/12)..."
            docker compose ps
            HEALTHY_COUNT=$(docker compose ps | grep -c "healthy" || true)
            if [ "$HEALTHY_COUNT" -ge 2 ]; then
              echo "All services are healthy!"
              break
            fi
            sleep 5
          done

          # Kiểm tra lại lần cuối
          FINAL_COUNT=$(docker compose ps | grep -c "healthy" || true)
          if [ "$FINAL_COUNT" -lt 2 ]; then
            echo "Healthcheck failed! Logs:"
            docker compose logs
            exit 1
          fi

  cd-deploy:
    name: CD - Build & Push Image to Docker Hub
    needs: ci-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:1.0
