name: Product API CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v3

      - name: Khởi tạo môi trường Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Cài đặt Dependencies
        run: npm ci

      - name: Kiểm tra Build Docker Image
        run: docker build -t product-api:test .

      - name: Khởi chạy Docker Compose và kiểm tra Healthcheck
        run: |
          docker compose up -d
          sleep 15
          docker compose ps