name: product-api

services:
  mongodb:
    image: mongo:8
    container_name: nammongodb
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "quit(db.adminCommand('ping').ok ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  product-api:
    build: .
    image: product-api:1.0
    container_name: product-api-dev
    env_file:
      - .env.docker
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      MONGO_URI: "mongodb://mongodb:27017/productdb"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const http = require('http'); const req = http.get('http://127.0.0.1:3000/health', res => { res.resume(); process.exit(res.statusCode === 200 ? 0 : 1); }); req.on('error', () => process.exit(1)); req.setTimeout(3000, () => { req.destroy(); process.exit(1); });"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mongodb_data:
    external: true
    name: nammongodb_data

  mongodb_config:
    external: true
    name: 0f8c170ebec3a0762041cbaaae68ec09482cc6b307e4afe6c8a60b5e5d4cf056
